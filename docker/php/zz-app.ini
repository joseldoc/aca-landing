; Production-leaning overrides. Not secrets — safe to ship in the image.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 8M

date.timezone = Europe/Paris

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Set to 0 only once you have a redeploy flow that always restarts the
; container on code changes (this build does) — avoids re-stat'ing every
; file on every request in production.
opcache.validate_timestamps = 0
; Populated by `bin/console cache:warmup --env=prod` during the image build —
; see Dockerfile. If that step is ever skipped, this path simply won't exist
; yet and opcache falls back to its normal (non-preloaded) behaviour.
opcache.preload = /var/www/html/config/preload.php
opcache.preload_user = www-data
